name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Shows what merging would change. The plan role is read-only, so the plan runs without
  # the state lock. Skipped until bootstrap's variables are set, and for forks and
  # Dependabot, which get no OIDC token.
  plan:
    name: Plan
    needs: check
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      TF_VAR_include_www: ${{ vars.INCLUDE_WWW || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform plan
        working-directory: infrastructure/terraform/site
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=site/terraform.tfstate" \
            -backend-config="region=$TF_VAR_aws_region"
          terraform plan -input=false -no-color -lock=false | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
